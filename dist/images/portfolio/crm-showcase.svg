<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="crm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170c29"/>
      <stop offset="50%" stop-color="#2d1254"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="crm-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="crm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#crm-bg)"/>

  <!-- Glowing background circles -->
  <circle cx="200" cy="180" r="150" fill="#a855f7" opacity="0.15"/>
  <circle cx="650" cy="400" r="160" fill="#ec4899" opacity="0.12"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)" filter="url(#crm-shadow)">
    <rect width="640" height="430" rx="14" fill="#0f0a1c" stroke="#2c1b4d" stroke-width="2"/>
    <rect width="640" height="44" rx="14" fill="#18112e"/>
    <rect y="30" width="640" height="14" fill="#18112e"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="22" r="6" fill="#10b981"/>
    
    <rect x="110" y="10" width="420" height="24" rx="6" fill="#100b21" stroke="#2e1f57" stroke-width="1"/>
    <text x="130" y="26" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">https://crm.websirg.com/pipeline</text>
    <circle cx="510" cy="22" r="4" fill="#a855f7"/>

    <!-- Dashboard Content -->
    <g transform="translate(20, 60)">
      <!-- Sidebar -->
      <rect width="130" height="350" rx="8" fill="#130d24"/>
      <text x="16" y="32" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">OrbitCRM</text>
      <text x="16" y="46" fill="#7c3aed" font-family="sans-serif" font-size="9">ENTERPRISE SUITE</text>
      
      <rect x="12" y="66" width="106" height="26" rx="6" fill="#9333ea" fill-opacity="0.25"/>
      <circle cx="24" cy="79" r="4" fill="#c084fc"/>
      <text x="36" y="83" fill="#e9d5ff" font-family="sans-serif" font-size="11" font-weight="600">Sales Funnel</text>

      <circle cx="24" cy="115" r="4" fill="#6b21a8"/>
      <text x="36" y="119" fill="#c4b5fd" font-family="sans-serif" font-size="11">Lead Inbox</text>

      <circle cx="24" cy="147" r="4" fill="#6b21a8"/>
      <text x="36" y="151" fill="#c4b5fd" font-family="sans-serif" font-size="11">Team Targets</text>

      <circle cx="24" cy="179" r="4" fill="#6b21a8"/>
      <text x="36" y="183" fill="#c4b5fd" font-family="sans-serif" font-size="11">Conversions</text>

      <!-- Main CRM Pipeline -->
      <g transform="translate(145, 0)">
        <!-- Top Metrics -->
        <rect x="0" y="0" width="140" height="66" rx="8" fill="#1b1236" stroke="#3b2066" stroke-width="1"/>
        <text x="12" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="10">TOTAL LEADS (MTD)</text>
        <text x="12" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">8,420</text>
        <text x="80" y="48" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">↑ 34%</text>

        <rect x="150" y="0" width="140" height="66" rx="8" fill="#1b1236" stroke="#3b2066" stroke-width="1"/>
        <text x="162" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="10">PIPELINE VALUE</text>
        <text x="162" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">₹ 42.8 L</text>
        <text x="235" y="48" fill="#a855f7" font-family="sans-serif" font-size="11" font-weight="600">Active</text>

        <rect x="300" y="0" width="145" height="66" rx="8" fill="#1b1236" stroke="#3b2066" stroke-width="1"/>
        <text x="312" y="22" fill="#c4b5fd" font-family="sans-serif" font-size="10">TEAM MEMBERS</text>
        <text x="312" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700">18</text>
        <circle cx="395" cy="44" r="5" fill="#a855f7"/>

        <!-- Kanban Columns -->
        <g transform="translate(0, 78)">
          <!-- Col 1: Qualified -->
          <rect x="0" y="0" width="140" height="230" rx="8" fill="#120c24" stroke="#2a174a" stroke-width="1"/>
          <text x="12" y="24" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">Qualified (42)</text>
          
          <rect x="8" y="36" width="124" height="54" rx="6" fill="#1e1338"/>
          <text x="16" y="54" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Fintech API Lead</text>
          <text x="16" y="70" fill="#a78bfa" font-family="sans-serif" font-size="9">₹ 1,20,000 • In review</text>

          <rect x="8" y="98" width="124" height="54" rx="6" fill="#1e1338"/>
          <text x="16" y="116" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">Logistics ERP Client</text>
          <text x="16" y="132" fill="#a78bfa" font-family="sans-serif" font-size="9">₹ 2,50,000 • Palak J.</text>

          <!-- Col 2: Proposal Sent -->
          <rect x="150" y="0" width="140" height="230" rx="8" fill="#120c24" stroke="#2a174a" stroke-width="1"/>
          <text x="162" y="24" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700">Proposal (19)</text>
          
          <rect x="158" y="36" width="124" height="54" rx="6" fill="#151b38"/>
          <text x="166" y="54" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">On-Demand App</text>
          <text x="166" y="70" fill="#93c5fd" font-family="sans-serif" font-size="9">₹ 4,80,000 • Priyanshu</text>

          <!-- Col 3: Won / Closed -->
          <rect x="300" y="0" width="145" height="230" rx="8" fill="#120c24" stroke="#2a174a" stroke-width="1"/>
          <text x="312" y="24" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="700">Closed Won (65)</text>
          
          <rect x="308" y="36" width="129" height="54" rx="6" fill="#0d241c"/>
          <text x="316" y="54" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600">E-Commerce Platform</text>
          <text x="316" y="70" fill="#6ee7b7" font-family="sans-serif" font-size="9">₹ 3,40,000 • Won ★</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Floating Badge -->
  <g transform="translate(160, 504)">
    <rect width="480" height="56" rx="28" fill="#140b26" stroke="#a855f7" stroke-width="1.5" filter="url(#crm-shadow)"/>
    <circle cx="34" cy="28" r="16" fill="#a855f7"/>
    <text x="34" y="34" fill="#ffffff" font-size="16" text-anchor="middle">⚡</text>
    
    <text x="62" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Websirg Cloud CRM Panel</text>
    <text x="62" y="44" fill="#c4b5fd" font-family="sans-serif" font-size="11">Custom CRM Pipeline, Lead Distribution &amp; Sales Management</text>
    
    <rect x="375" y="14" width="90" height="28" rx="14" fill="#a855f7"/>
    <text x="420" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ENTERPRISE</text>
  </g>
</svg>