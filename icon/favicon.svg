<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blueHalf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orangeHalf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="wBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="wOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="leftClip">
      <rect x="0" y="0" width="50" height="100"/>
    </clipPath>
    <clipPath id="rightClip">
      <rect x="50" y="0" width="50" height="100"/>
    </clipPath>
  </defs>

  <!-- Left Half Globe (Blue Tech) -->
  <g clip-path="url(#leftClip)">
    <circle cx="50" cy="50" r="46" fill="url(#blueHalf)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <path d="M 50 10 A 40 40 0 0 0 18 36 L 35 36 A 22 22 0 0 1 50 20 Z" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="35" cy="36" r="2.5" fill="#38bdf8"/>
    <path d="M 22 52 A 28 28 0 0 0 50 78 L 50 64" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="36" cy="52" r="2.5" fill="#38bdf8"/>
  </g>

  <!-- Right Half Globe (Vibrant Orange Tech) -->
  <g clip-path="url(#rightClip)">
    <circle cx="50" cy="50" r="46" fill="url(#orangeHalf)" stroke="#fed7aa" stroke-width="2" filter="url(#glow)"/>
    <ellipse cx="50" cy="50" rx="23" ry="44" fill="none" stroke="#fed7aa" stroke-width="2" opacity="0.8"/>
    <circle cx="72" cy="35" r="2.8" fill="#ffffff"/>
    <path d="M 50 20 A 30 30 0 0 1 78 42 L 66 42" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="66" cy="42" r="2" fill="#ffffff"/>
    <path d="M 50 66 A 20 20 0 0 1 68 52" fill="none" stroke="#fed7aa" stroke-width="2"/>
  </g>

  <!-- Center Dividing Meridian Line -->
  <line x1="50" y1="4" x2="50" y2="96" stroke="#ffffff" stroke-width="2" opacity="0.6"/>

  <!-- Metallic 3D 'W' Emblem Overlay (Blue & Orange Double Ribbon) -->
  <!-- Outer Deep Blue Chevron -->
  <polygon points="12,38 23,38 37,74 50,44 63,74 77,38 88,38 70,86 58,86 50,66 42,86 30,86" fill="url(#wBlue)" filter="url(#glow)"/>

  <!-- Inner Vibrant Orange Chevron Inset -->
  <polygon points="17,41 24,41 37,71 50,43 63,71 76,41 83,41 68,82 60,82 50,62 40,82 32,82" fill="url(#wOrange)"/>

  <!-- Core Golden-Orange Center Accent -->
  <polygon points="20,43 23,43 37,68 50,45 63,68 77,43 80,43 66,79 61,79 50,59 39,79 34,79" fill="#ffedd5"/>
</svg>
