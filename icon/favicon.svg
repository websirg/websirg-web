<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1d3a"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="blueMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular Tech Globe Base -->
  <circle cx="50" cy="50" r="46" fill="url(#globeGrad)" stroke="url(#silverGrad)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Tech Circuit & Globe Lat/Long Arcs -->
  <!-- Left Side: Tech Circuit Nodes -->
  <path d="M 50 8 A 42 42 0 0 0 16 35 L 34 35 A 24 24 0 0 1 50 18 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.75"/>
  <circle cx="34" cy="35" r="2.2" fill="#38bdf8"/>
  <path d="M 22 50 A 28 28 0 0 0 50 78 L 50 64 A 14 14 0 0 1 36 50 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.65"/>
  <circle cx="36" cy="50" r="2.2" fill="#38bdf8"/>

  <!-- Right Side: Digital Meridian Arcs -->
  <ellipse cx="50" cy="50" rx="22" ry="44" fill="none" stroke="url(#silverGrad)" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.5"/>
  <line x1="8" y1="50" x2="92" y2="50" stroke="url(#silverGrad)" stroke-width="1.2" opacity="0.4"/>
  <circle cx="70" cy="36" r="2.2" fill="#cbd5e1"/>
  <path d="M 50 18 A 32 32 0 0 1 78 40" fill="none" stroke="url(#silverGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Center Vertical Dividing Line -->
  <line x1="50" y1="6" x2="50" y2="94" stroke="url(#silverGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Metallic 3D 'W' Emblem Overlay -->
  <!-- Outer Blue W -->
  <polygon points="12,38 23,38 37,74 50,44 63,74 77,38 88,38 70,86 58,86 50,66 42,86 30,86" fill="url(#blueMetal)" filter="url(#glow)"/>

  <!-- Inner Silver W Inset -->
  <polygon points="18,41 24,41 37,71 50,42 63,71 76,41 82,41 68,82 60,82 50,62 40,82 32,82" fill="url(#silverGrad)"/>

  <!-- Core Blue Accent Rib -->
  <polygon points="21,43 23,43 37,68 50,45 63,68 77,43 79,43 66,79 61,79 50,58 39,79 34,79" fill="#0369a1"/>
</svg>
