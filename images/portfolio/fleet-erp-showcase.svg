<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1826"/>
      <stop offset="50%" stop-color="#102e4c"/>
      <stop offset="100%" stop-color="#1a4975"/>
    </linearGradient>
    <linearGradient id="fl-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="fl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#fl-bg)"/>

  <!-- Glowing background circles -->
  <circle cx="180" cy="180" r="150" fill="#38bdf8" opacity="0.14"/>
  <circle cx="660" cy="400" r="160" fill="#2563eb" opacity="0.15"/>

  <!-- Browser Window Mockup -->
  <g transform="translate(80, 50)" filter="url(#fl-shadow)">
    <rect width="640" height="430" rx="14" fill="#081422" stroke="#1c3757" stroke-width="2"/>
    <rect width="640" height="44" rx="14" fill="#0d2238"/>
    <rect y="30" width="640" height="14" fill="#0d2238"/>
    <circle cx="28" cy="22" r="6" fill="#ef4444"/>
    <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="22" r="6" fill="#10b981"/>
    
    <rect x="110" y="10" width="420" height="24" rx="6" fill="#08182b" stroke="#1e446d" stroke-width="1"/>
    <text x="130" y="26" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">https://fleet.websirg.com/dispatch</text>
    <circle cx="510" cy="22" r="4" fill="#38bdf8"/>

    <!-- Map & Dispatch Grid -->
    <g transform="translate(20, 60)">
      <!-- Left: Map Area -->
      <rect width="410" height="350" rx="10" fill="#05101a" stroke="#163757" stroke-width="1"/>
      
      <!-- Geofence Grid lines -->
      <path d="M 30 50 L 380 70 L 350 280 L 50 240 Z" fill="#0284c7" fill-opacity="0.08" stroke="#0284c7" stroke-width="1" stroke-dasharray="4,4"/>
      <path d="M 60 120 Q 180 80 240 180 T 360 220" fill="none" stroke="#1e4d79" stroke-width="6" stroke-linecap="round"/>
      <path d="M 60 120 Q 180 80 240 180 T 360 220" fill="none" stroke="url(#fl-blue)" stroke-width="3" stroke-linecap="round"/>

      <!-- Rider GPS Pings -->
      <circle cx="60" cy="120" r="10" fill="#38bdf8" fill-opacity="0.3"/>
      <circle cx="60" cy="120" r="5" fill="#38bdf8"/>
      
      <circle cx="240" cy="180" r="14" fill="#10b981" fill-opacity="0.3"/>
      <circle cx="240" cy="180" r="6" fill="#10b981"/>

      <circle cx="360" cy="220" r="10" fill="#f59e0b" fill-opacity="0.3"/>
      <circle cx="360" cy="220" r="5" fill="#f59e0b"/>

      <!-- Rider Info Marker -->
      <g transform="translate(160, 210)">
        <rect width="160" height="52" rx="6" fill="#0b223c" stroke="#38bdf8" stroke-width="1"/>
        <text x="12" y="20" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Rider #TO-104 (Rahul)</text>
        <text x="12" y="36" fill="#7dd3fc" font-family="sans-serif" font-size="9">ETA: 6 mins • Speed: 38 km/h</text>
      </g>

      <!-- Right: Queue & Active Jobs -->
      <g transform="translate(425, 0)">
        <rect width="175" height="350" rx="10" fill="#091829" stroke="#163757" stroke-width="1"/>
        <text x="14" y="28" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">DISPATCH QUEUE</text>
        
        <!-- Job 1 -->
        <rect x="10" y="42" width="155" height="64" rx="6" fill="#0f263d"/>
        <text x="18" y="60" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Order #FL-9021</text>
        <text x="18" y="74" fill="#94a3b8" font-family="sans-serif" font-size="9">Pickup: Hub South</text>
        <rect x="18" y="82" width="60" height="16" rx="4" fill="#10b981" fill-opacity="0.2"/>
        <text x="48" y="94" fill="#34d399" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">ASSIGNED</text>

        <!-- Job 2 -->
        <rect x="10" y="114" width="155" height="64" rx="6" fill="#0f263d"/>
        <text x="18" y="132" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Order #FL-9022</text>
        <text x="18" y="146" fill="#94a3b8" font-family="sans-serif" font-size="9">Pickup: Hub West</text>
        <rect x="18" y="154" width="70" height="16" rx="4" fill="#38bdf8" fill-opacity="0.2"/>
        <text x="53" y="166" fill="#7dd3fc" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">OPTIMIZING</text>

        <!-- Dispatch Stats -->
        <g transform="translate(10, 250)">
          <rect width="155" height="85" rx="6" fill="#0c1f33" stroke="#1d456d" stroke-width="1"/>
          <text x="14" y="24" fill="#94a3b8" font-family="sans-serif" font-size="9">DISPATCH EFFICIENCY</text>
          <text x="14" y="52" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">98.6%</text>
          <text x="14" y="72" fill="#34d399" font-family="sans-serif" font-size="9">Avg Dispatch: 42 sec</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Floating Badge -->
  <g transform="translate(160, 504)">
    <rect width="480" height="56" rx="28" fill="#08182b" stroke="#38bdf8" stroke-width="1.5" filter="url(#fl-shadow)"/>
    <circle cx="34" cy="28" r="16" fill="#38bdf8"/>
    <text x="34" y="34" fill="#ffffff" font-size="16" text-anchor="middle">📍</text>
    
    <text x="62" y="28" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Hyperlocal Fleet Dispatch ERP</text>
    <text x="62" y="44" fill="#7dd3fc" font-family="sans-serif" font-size="11">Automated Rider Assignment &amp; Live Telemetry Engine</text>
    
    <rect x="375" y="14" width="90" height="28" rx="14" fill="#38bdf8"/>
    <text x="420" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ENTERPRISE</text>
  </g>
</svg>