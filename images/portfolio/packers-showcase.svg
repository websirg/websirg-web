<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181310"/>
      <stop offset="50%" stop-color="#331c12"/>
      <stop offset="100%" stop-color="#542410"/>
    </linearGradient>
    <linearGradient id="pm-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="pm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#pm-bg)"/>

  <!-- Glowing background circles -->
  <circle cx="220" cy="200" r="160" fill="#f97316" opacity="0.12"/>
  <circle cx="640" cy="380" r="180" fill="#fb923c" opacity="0.1"/>

  <!-- Left: Phone Mockup with Logistics Booking & Dispatch -->
  <g transform="translate(100, 40)" filter="url(#pm-shadow)">
    <rect width="250" height="500" rx="36" fill="#14100c" stroke="#3d2618" stroke-width="4"/>
    <rect x="8" y="8" width="234" height="484" rx="30" fill="#0d0a08"/>
    <rect x="85" y="16" width="80" height="12" rx="6" fill="#291910"/>

    <!-- App Header -->
    <g transform="translate(20, 40)">
      <text x="0" y="16" fill="#fdba74" font-family="sans-serif" font-size="10">FLEET PARTNER APP</text>
      <text x="0" y="36" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">Packers &amp; Movers</text>
      <rect x="135" y="20" width="75" height="20" rx="10" fill="url(#pm-orange)"/>
      <text x="172" y="34" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">ONLINE</text>
    </g>

    <!-- Active Job Alert Card -->
    <g transform="translate(20, 90)">
      <rect width="210" height="90" rx="12" fill="url(#pm-orange)"/>
      <text x="16" y="24" fill="#ffedd5" font-family="sans-serif" font-size="10" font-weight="700">NEW SHIFTING REQUEST</text>
      <text x="16" y="48" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800">₹ 14,500 Offer</text>
      <text x="16" y="68" fill="#fed7aa" font-family="sans-serif" font-size="10">3 BHK Shifting • Delhi to Gurugram</text>
    </g>

    <!-- Trip Details -->
    <g transform="translate(20, 195)">
      <rect width="210" height="110" rx="10" fill="#1a120c" stroke="#382114" stroke-width="1"/>
      <circle cx="20" cy="25" r="5" fill="#10b981"/>
      <text x="35" y="29" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Pickup: Sector 62, Noida</text>
      
      <line x1="20" y1="35" x2="20" y2="55" stroke="#f97316" stroke-width="2" stroke-dasharray="3,3"/>
      
      <circle cx="20" cy="65" r="5" fill="#ef4444"/>
      <text x="35" y="69" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Drop: DLF Cyber City, GGN</text>

      <rect x="14" y="80" width="85" height="20" rx="4" fill="#2d1c12"/>
      <text x="56" y="94" fill="#fed7aa" font-family="sans-serif" font-size="9" text-anchor="middle">Truck: 14ft Canter</text>
      <rect x="105" y="80" width="90" height="20" rx="4" fill="#2d1c12"/>
      <text x="150" y="94" fill="#fed7aa" font-family="sans-serif" font-size="9" text-anchor="middle">3 Helpers Included</text>
    </g>

    <!-- Bid Button -->
    <rect x="20" y="320" width="210" height="42" rx="10" fill="#f97316"/>
    <text x="125" y="346" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">ACCEPT &amp; DISPATCH TRUCK</text>

    <!-- Bottom Nav -->
    <rect x="8" y="430" width="234" height="60" rx="20" fill="#140e09"/>
    <text x="45" y="465" font-size="14" text-anchor="middle">🚛</text>
    <text x="95" y="465" font-size="14" text-anchor="middle">📑</text>
    <text x="145" y="465" font-size="14" text-anchor="middle">💵</text>
    <text x="195" y="465" font-size="14" text-anchor="middle">👤</text>
  </g>

  <!-- Right: Feature Details -->
  <g transform="translate(390, 80)">
    <rect width="210" height="32" rx="16" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-width="1.5"/>
    <text x="105" y="21" fill="#fb923c" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">LOGISTICS &amp; TRANSPORT APP</text>

    <text x="0" y="75" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800">Packers &amp; Movers</text>
    <text x="0" y="105" fill="#fed7aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500">Partner &amp; Fleet Driver Mobile App</text>

    <text x="0" y="145" fill="#94a3b8" font-family="sans-serif" font-size="13">
      <tspan x="0" dy="0">Engineered for transport vendors, house shifting agencies, and</tspan>
      <tspan x="0" dy="20">independent truck owners to manage lead auctions, live GPS tracking,</tspan>
      <tspan x="0" dy="20">instant fare estimates, and customer inventory lists.</tspan>
    </text>

    <!-- Metric boxes -->
    <g transform="translate(0, 220)">
      <rect width="110" height="70" rx="10" fill="#23150d" stroke="#4a2512" stroke-width="1"/>
      <text x="20" y="32" fill="#f97316" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Live GPS</text>
      <text x="20" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Truck Tracking</text>

      <rect x="125" y="0" width="110" height="70" rx="10" fill="#23150d" stroke="#4a2512" stroke-width="1"/>
      <text x="145" y="32" fill="#fb923c" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Instant</text>
      <text x="145" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Bid Negotiation</text>

      <rect x="250" y="0" width="110" height="70" rx="10" fill="#23150d" stroke="#4a2512" stroke-width="1"/>
      <text x="270" y="32" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800">Zero Lag</text>
      <text x="270" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Booking Sync</text>
    </g>

    <!-- Google Play Button -->
    <g transform="translate(0, 320)" filter="url(#pm-shadow)">
      <rect width="260" height="60" rx="12" fill="#000000" stroke="#4a2512" stroke-width="1.5"/>
      <g transform="translate(20, 16)">
        <polygon points="4,2 18,14 4,26" fill="#f97316"/>
        <polygon points="4,2 18,14 12,18 4,14" fill="#fb923c"/>
        <polygon points="4,26 18,14 12,10 4,14" fill="#ea580c"/>
        <polygon points="18,14 26,9 22,7" fill="#f59e0b"/>
      </g>
      <text x="64" y="26" fill="#94a3b8" font-family="sans-serif" font-size="10">GET IT ON</text>
      <text x="64" y="46" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Google Play</text>
      <circle cx="230" cy="30" r="12" fill="#24140b"/>
      <text x="230" y="35" fill="#f97316" font-size="14" text-anchor="middle">↗</text>
    </g>
  </g>
</svg>